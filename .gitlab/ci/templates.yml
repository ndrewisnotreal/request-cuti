# Hidden job templates. Dipakai via `extends` / `!reference`, tidak pernah jalan sendiri.

.rules:quality:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

.rules:main:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.rules:deploy:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "development"

# Gate optional: branch development tidak membuat job lint/test/sonar/clamav.
.quality_gate:
  needs:
    - job: eslint-lint
      optional: true
      artifacts: false
    - job: unit-test
      optional: true
      artifacts: false
    - job: build-sonar
      optional: true
      artifacts: false
    - job: clamav-scan
      optional: true
      artifacts: false

.node_job:
  image: $NODE_IMAGE
  interruptible: true
  cache:
    key:
      prefix: npm
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

.docker_job:
  image: $DOCKER_IMAGE
  services: []
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin

.remote_job:
  extends: .rules:deploy
  image: $ALPINE_IMAGE
  resource_group: deploy-$ENV_NAME
  variables:
    SSH_HOST: $TARGET_IP
    DEPLOY_PATH: /home/deploy/$APPS_NAME
    APK_EXTRA: ""
  before_script:
    - apk add --no-cache openssh-client $APK_EXTRA
    - . .gitlab/scripts/ssh-setup.sh
