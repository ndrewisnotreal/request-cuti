services:
  cuti-frontend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL required}
    networks:
      - global-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=global-network

        - traefik.http.routers.cuti-frontend.rule=Host(`sicuti.inalum.id`)
        - traefik.http.routers.cuti-frontend.entrypoints=websecure
        - traefik.http.routers.cuti-frontend.tls=true
        - traefik.http.routers.cuti-frontend.tls.certresolver=letsencrypt

        - traefik.http.services.cuti-frontend.loadbalancer.server.port=80

        - traefik.http.routers.cuti-frontend-http.rule=Host(`sicuti.inalum.id`)
        - traefik.http.routers.cuti-frontend-http.entrypoints=web
        - traefik.http.routers.cuti-frontend-http.middlewares=cuti-redirect

        - traefik.http.middlewares.cuti-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.cuti-redirect.redirectscheme.permanent=true

networks:
  global-network:
    external: true
