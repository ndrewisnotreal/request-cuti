# Dirender ke /etc/nginx/conf.d/default.conf via envsubst (image nginx resmi).
# BACKEND_URL = scheme + host + path Kong, mis. https://devapi.inalum.id/cuti
# Trailing slash di proxy_pass wajib: prefix /api diganti path BACKEND_URL
# (sama seperti vite.config.mjs: path.replace(/^\/api/, '')).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Jangan pakai `$uri/` — di belakang Traefik stripprefix itu memicu
    # 301 ke `/$uri/` di root host (prefix /cuti hilang).
    location / {
        try_files $uri /index.html;
    }

    location = /api {
        rewrite ^ /api/ last;
    }

    location = /cuti/api {
        rewrite ^ /cuti/api/ last;
    }

    location ^~ /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Jika request sampai tanpa Traefik strip (akses langsung ke container).
    location ^~ /cuti/api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}
